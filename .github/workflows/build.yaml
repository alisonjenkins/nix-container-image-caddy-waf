name: build
run-name: build and smoke-test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14
      - name: Build the config and test script (runs shellcheck)
        run: nix flake check
      - name: Build the image
        run: nix build -o container '.#packages.x86_64-linux.container'
      - name: Smoke-test the image under podman
        run: |
          podman load < container
          nix run '.#smoke-test'
