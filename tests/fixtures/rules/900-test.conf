# Same shapes as a real app's exclusions: token-protected API paths skip body
# inspection, login password fields are not scored.
SecRule REQUEST_FILENAME "@rx ^/(?:api\.|admin/v1/)" \
    "id:1000,phase:1,pass,nolog,ctl:requestBodyAccess=Off,ctl:ruleRemoveById=920420"
SecRule REQUEST_FILENAME "@beginsWith /ui/login/" \
    "id:1001,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password"
