# Coraza engine settings. A port of the effective modsecurity.conf of
# owasp/modsecurity-crs:4.30.0-nginx-alpine with the env the home-cluster
# WAFs set, so behaviour carries over. Values that vary per app are Caddyfile
# env placeholders, filled in at start (see Caddyfile).
#
# Left out because Coraza has no such directive or they only tune PCRE or
# the nginx connector: SecPcreMatchLimit*, SecUnicodeMapFile,
# SecStatusEngine, SecCookieFormat, SecDisableBackendCompression,
# SecTmpSaveUploadedFiles, SecAuditLogStorageDir, SecRequestBodyJsonDepthLimit,
# SecArgumentSeparator. SecRequestBodyNoFilesLimit is parsed but not enforced
# by Coraza, so the Caddyfile caps those bodies instead.

SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyLimitAction Reject
SecArgumentsLimit 1000

SecResponseBodyAccess Off
SecResponseBodyMimeType text/plain text/html text/xml
SecResponseBodyLimit 1048576
SecResponseBodyLimitAction ProcessPartial

SecTmpDir /tmp
SecDataDir /tmp
SecUploadDir /tmp
SecUploadFileMode 0600
SecUploadKeepFiles Off

# Audit log: parts A (client, URI) and H (matched rules) only. Part B would
# record Authorization headers and session cookies.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:400|403|413)$"
SecAuditLogParts AHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /dev/stdout

SecDebugLogLevel 0

# Body processors, as in the ModSecurity image.
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
    "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "^application/[a-z0-9.-]+[+]json" \
    "id:200006,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

SecRule &ARGS "@ge 1000" \
    "id:200007,phase:2,t:none,log,deny,status:400,msg:'Failed to fully parse request body due to large argument count',severity:2"
SecRule REQBODY_ERROR "!@eq 0" \
    "id:200002,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:200003,phase:2,t:none,log,deny,status:400,msg:'Multipart request body failed strict validation.'"
SecRule MULTIPART_UNMATCHED_BOUNDARY "@eq 1" \
    "id:200004,phase:2,t:none,log,deny,msg:'Multipart parser detected a possible unmatched boundary.'"
